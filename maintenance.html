<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Fetman Digital is temporarily undergoing scheduled maintenance. We'll be back soon.">
    <meta name="robots" content="noindex, nofollow">
    <title>Fetman Digital | We're Making Improvements</title>
    <style>
        :root {
            --ink: #062B33;
            --mint: #20C4BE;
            --accent-muted: #D5DADD;
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
        }

        body {
            display: flex;
            min-height: 100vh;
            margin: 0;
            flex-direction: column;
            background: linear-gradient(135deg, #062B33, #12454D);
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .topbar,
        .container,
        .footer {
            width: min(100% - 48px, 1140px);
            margin: 0 auto;
        }

        .topbar {
            padding-top: 28px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 20px;
            font-weight: 700;
        }

        .topbar span {
            color: var(--accent-muted);
        }

        main {
            display: flex;
            flex: 1;
            align-items: center;
            padding: 72px 0;
        }

        .container {
            animation: arrive .7s ease both;
        }

        .eyebrow {
            margin: 0 0 18px;
            color: var(--mint);
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
        }

        h1 {
            max-width: 780px;
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 64px;
            line-height: 1.05;
        }

        h1 span {
            color: var(--mint);
        }

        .message {
            max-width: 540px;
            margin: 24px 0 32px;
            color: rgba(255, 255, 255, .76);
            font-size: 17px;
            line-height: 1.7;
        }

        .email-link {
            display: inline-flex;
            min-height: 48px;
            align-items: center;
            padding: 0 18px;
            border: 1px solid var(--mint);
            border-radius: 3px;
            background: var(--mint);
            color: var(--ink);
            font-weight: 700;
            text-decoration: none;
            transition: background .2s ease, transform .2s ease;
        }

        .email-link:hover {
            background: #0FAFA9;
            transform: translateY(-2px);
        }

        .footer {
            padding: 20px 0 26px;
            border-top: 1px solid rgba(255, 255, 255, .2);
            color: rgba(255, 255, 255, .6);
            font-size: 13px;
        }

        @keyframes arrive {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            body {
                background-image: linear-gradient(135deg, #062B33, #12454D);
                background-attachment: scroll;
                background-position: left center;
            }

            h1 {
                font-size: 44px;
            }

            .message {
                font-size: 16px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">Fetman Digital<span>.</span></header>
    <main>
        <div class="container">
            <p class="eyebrow">Fetman Digital</p>
            <h1>We’re making<br><span>improvements.</span></h1>
            <p class="message">Fetman Digital is temporarily undergoing scheduled maintenance. We’ll be back soon. For enquiries in the meantime, send us a note and we’ll be happy to help.</p>
            <a class="email-link" href="mailto:info@fetmandigital.com">Email the studio <span aria-hidden="true">&nbsp;↗</span></a>
        </div>
    </main>
    <footer class="footer">Fetman Digital (PTY) LTD · Durban, South Africa</footer>
</body>
</html>
